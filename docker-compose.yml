services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Серверные IP (Hetzner и т.п.) YouTube/Instagram/TikTok часто блокируют.
      # Бот сначала пробует напрямую, а при блокировке идёт через Cloudflare WARP.
      PROXY_URL: ${PROXY_URL:-socks5://warp:1080}
      # Генератор PO-токенов для YouTube (снижает "Sign in to confirm you're not a bot")
      POT_PROVIDER_URL: ${POT_PROVIDER_URL:-http://pot-provider:4416}
    depends_on:
      - warp
      - pot-provider
    volumes:
      - ./data:/app/data
      # - ./cookies.txt:/app/cookies.txt:ro      # если нужен Instagram/YouTube с cookies
      - tg-api-data:/var/lib/telegram-bot-api    # нужен только вместе с telegram-bot-api ниже

  # Cloudflare WARP как SOCKS5-прокси (только внутри docker-сети, наружу порт не открыт)
  warp:
    image: caomingjun/warp:latest
    restart: unless-stopped
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WARP_SLEEP: "2"
    volumes:
      - warp-data:/var/lib/cloudflare-warp

  # PO-token provider для yt-dlp (https://github.com/Brainicism/bgutil-ytdlp-pot-provider)
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true

  # Необязательно, но рекомендуется: свой Bot API сервер.
  # Видео до 2 ГБ вместо 50 МБ (= всегда хорошее качество) и распознавание присланных файлов любого размера.
  # Получите api_id / api_hash на https://my.telegram.org, добавьте их в .env
  # и укажите TELEGRAM_API_URL=http://telegram-bot-api:8081
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    profiles: ["local-api"]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-api-data:/var/lib/telegram-bot-api

volumes:
  tg-api-data:
  warp-data:
