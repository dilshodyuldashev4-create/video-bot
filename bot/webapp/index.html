<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Плеер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0d0d0d;
    --bg1: #171717;
    --bg2: #212121;
    --bg3: #2b2b2b;
    --text: #ffffff;
    --hint: #8c8c8c;
    --acc: #ffd83d;
    --acc-text: #141414;
    --safe-b: env(safe-area-inset-bottom);
    --tab-h: 58px;
    --dyn: 255 216 61;          /* colour of the current cover, set from JS */
    --glow: 0;                  /* 0..1 loudness, set from JS every frame */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none;
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  img { display: block; }
  .page { padding: 8px 16px calc(var(--tab-h) + 86px + var(--safe-b)); max-width: 600px; margin: 0 auto; display: none; }
  .page.on { display: block; animation: fade .25s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  .page.on .row { animation: rise .4s cubic-bezier(.2,.9,.3,1) both; }
  .page.on .row:nth-child(2) { animation-delay: .03s; } .page.on .row:nth-child(3) { animation-delay: .06s; }
  .page.on .row:nth-child(4) { animation-delay: .09s; } .page.on .row:nth-child(5) { animation-delay: .12s; }
  .page.on .row:nth-child(6) { animation-delay: .15s; } .page.on .row:nth-child(n+7) { animation-delay: .18s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  body.norise .page.on .row { animation: none; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 4px; }
  .hello { color: var(--hint); font-size: 13px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--bg3); display: grid; place-items: center;
    font-weight: 700; font-size: 14px; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -.6px; margin: 4px 0 14px; }
  h2 { font-size: 21px; font-weight: 800; letter-spacing: -.3px; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }
  h2 .more { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--hint); }

  /* hero: "my stream" with a living wave */
  .hero { position: relative; height: 300px; border-radius: 24px; overflow: hidden; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero .content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .hero b { font-size: 30px; font-weight: 800; letter-spacing: -.6px; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  .hero span { color: rgba(255,255,255,.75); font-size: 14px; max-width: 260px; }
  .bigplay { width: 64px; height: 64px; border-radius: 50%; background: var(--acc); color: var(--acc-text); display: grid;
    place-items: center; box-shadow: 0 8px 30px rgba(255,216,61,.35); transition: transform .15s; }
  .bigplay:active { transform: scale(.92); }
  .bigplay svg { width: 30px; height: 30px; fill: currentColor; }

  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 10px; padding: 0 16px; }
  .chips::-webkit-scrollbar, .shelf::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 16px; border-radius: 999px; background: var(--bg2); font-size: 14px; font-weight: 600;
    transition: background .2s, color .2s; }
  .chip.on { background: var(--text); color: #111; }

  /* rows */
  .row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-radius: 10px; transition: background .15s; }
  .row:active { background: var(--bg1); }
  .rank { width: 22px; flex: none; text-align: center; font-weight: 800; color: var(--hint); font-variant-numeric: tabular-nums; }
  .row.playing .rank { color: rgb(var(--dyn)); }
  .cv { position: relative; flex: none; width: 48px; height: 48px; border-radius: 8px; overflow: hidden;
    display: grid; place-items: center; font-weight: 800; color: rgba(255,255,255,.9); font-size: 18px; background: var(--bg2); }
  .cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { display: block; color: var(--hint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.playing .t b { color: rgb(var(--dyn)); }
  .dur { color: var(--hint); font-size: 13px; font-variant-numeric: tabular-nums; }
  .eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
  .eq i { width: 3px; background: rgb(var(--dyn)); border-radius: 1px; animation: eq .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; }
  .paused .eq i { animation-play-state: paused; }
  @keyframes eq { 0%,100% { height: 3px; } 50% { height: 14px; } }

  /* shelves of square covers */
  .shelf { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; scroll-snap-type: x mandatory; }
  .tile { flex: none; width: 140px; scroll-snap-align: start; }
  .tile .sq { position: relative; width: 140px; height: 140px; border-radius: 12px; overflow: hidden; display: flex;
    align-items: flex-end; padding: 12px; font-weight: 800; font-size: 17px; line-height: 1.15; transition: transform .15s; }
  .tile:active .sq { transform: scale(.96); }
  .tile .sq .emo { position: absolute; right: 10px; top: 8px; font-size: 38px; }
  .tile .sq img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .cap { margin-top: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .sub { color: var(--hint); font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid .tile, .grid .tile .sq { width: 100%; }
  .grid .tile .sq { height: auto; aspect-ratio: 1.6; }

  .search { display: flex; align-items: center; gap: 10px; height: 46px; border-radius: 12px; background: var(--bg2); padding: 0 14px; margin: 0 0 14px; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); font-size: 16px; outline: none; }
  .search input::placeholder { color: var(--hint); }

  .like-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
  .like-row .sq { width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center; font-size: 28px;
    background: linear-gradient(135deg, #ff4f6d, #b1137a); flex: none; }
  .like-row b { font-size: 17px; } .like-row span { display: block; color: var(--hint); font-size: 13px; }

  .detail-head { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 0 14px; }
  .detail-head .sq { width: 180px; height: 180px; border-radius: 16px; display: grid; place-items: center; font-size: 64px;
    box-shadow: 0 20px 50px rgba(0,0,0,.6); overflow: hidden; position: relative; }
  .detail-head .sq img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .detail-head h1 { margin: 16px 0 2px; }
  .detail-head .sub { color: var(--hint); font-size: 14px; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
  .btn { height: 44px; padding: 0 22px; border-radius: 999px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
  .btn.acc { background: var(--acc); color: var(--acc-text); }
  .btn.dark { background: var(--bg2); }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  .back { display: inline-flex; align-items: center; gap: 4px; color: var(--hint); font-weight: 600; padding: 8px 0; }

  .empty { color: var(--hint); text-align: center; padding: 40px 20px; }
  .empty .big { font-size: 44px; display: block; margin-bottom: 10px; }
  .skel { height: 62px; border-radius: 10px; margin: 6px 0; background: linear-gradient(90deg, var(--bg1) 25%, var(--bg2) 50%, var(--bg1) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* tab bar + mini player */
  .tabbar { position: fixed; z-index: 12; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + var(--safe-b));
    padding-bottom: var(--safe-b); display: flex; background: rgba(13,13,13,.92); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px); border-top: 1px solid #1f1f1f; }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--hint); font-size: 11px; font-weight: 600; }
  .tabbar svg { width: 24px; height: 24px; fill: currentColor; }
  .tabbar button.on { color: var(--text); }
  .mini { position: fixed; z-index: 11; left: 8px; right: 8px; bottom: calc(var(--tab-h) + var(--safe-b) + 6px); height: 60px;
    border-radius: 14px; background: linear-gradient(90deg, rgb(var(--dyn) / .28), rgb(var(--dyn) / .12)), var(--bg2); display: flex; align-items: center; gap: 10px; padding: 0 6px 0 6px;
    transform: translateY(calc(100% + 80px)); transition: transform .35s cubic-bezier(.3,1.2,.5,1); overflow: hidden;
    max-width: 588px; margin: 0 auto; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .mini.show { transform: none; }
  .mini .cv { width: 46px; height: 46px; }
  .mini .t { flex: 1; min-width: 0; }
  .mini .t b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .t span { display: block; font-size: 12px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: rgb(var(--dyn)); box-shadow: 0 0 8px rgb(var(--dyn)); }
  .mini, .full .backdrop, .fill, .knob, .ctrl .pp { transition-property: transform, background, box-shadow, color; }
  .ib { width: 42px; height: 42px; display: grid; place-items: center; flex: none; border-radius: 50%; }
  .ib svg { width: 24px; height: 24px; fill: currentColor; }

  /* full player */
  .full { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; padding: 10px 22px calc(26px + var(--safe-b));
    transform: translateY(105%); transition: transform .4s cubic-bezier(.2,1,.3,1); background: var(--bg); overflow: hidden; }
  .full.show { transform: none; }
  .full::before { content: ""; position: absolute; inset: 0; z-index: 0; transition: background 1.2s;
    background: radial-gradient(120% 70% at 50% 20%, rgb(var(--dyn) / .55), transparent 70%), var(--bg); }
  .full .backdrop { position: absolute; inset: -20%; z-index: 0; filter: blur(70px) saturate(160%); opacity: .45; transition: background 1s; }
  .full .backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, var(--bg) 85%); }
  .full > *:not(.backdrop) { position: relative; z-index: 1; }
  .full .bar { display: flex; align-items: center; justify-content: space-between; }
  .full .bar span { font-size: 13px; color: rgba(255,255,255,.7); font-weight: 600; text-align: center; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .art { flex: 1; display: grid; place-items: center; min-height: 0; padding: 18px 0; }
  .art .cv { width: min(86vw, 52vh, 420px); height: auto; aspect-ratio: 1; border-radius: 14px; font-size: 90px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6), 0 0 calc(20px + var(--glow) * 90px) calc(var(--glow) * 18px) rgb(var(--dyn) / calc(.25 + var(--glow) * .5));
    transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
  .paused .art .cv { transform: scale(.86); }
  .info { display: flex; align-items: center; gap: 12px; }
  .info .t { flex: 1; min-width: 0; }
  .info b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info span { color: var(--hint); font-size: 16px; }
  .seek { margin-top: 18px; padding: 8px 0; touch-action: none; }
  .track { position: relative; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, rgb(var(--dyn) / .7), #fff); }
  .knob { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; left: 0; }
  .times { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--hint); font-variant-numeric: tabular-nums; }
  .ctrl { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .ctrl .ib { width: 52px; height: 52px; }
  .ctrl .ib svg { width: 30px; height: 30px; }
  .ctrl .pp { width: 72px; height: 72px; background: #fff; color: #111; }
  .ctrl .pp svg { width: 34px; height: 34px; }
  .tg { color: var(--hint); } .tg.on { color: rgb(var(--dyn)); }
  .ctrl .pp { box-shadow: 0 8px 30px rgb(var(--dyn) / .45); }

  /* action row: like, lyrics, sleep timer, queue */
  .acts { display: flex; justify-content: space-around; margin-top: 14px; }
  .acts .ib { width: 46px; height: 46px; color: rgba(255,255,255,.7); position: relative; transition: color .2s, transform .15s; }
  .acts .ib:active { transform: scale(.88); }
  .acts .ib svg { width: 24px; height: 24px; }
  .acts .ib.on { color: rgb(var(--dyn)); }
  .acts .ib[disabled] { opacity: .3; }
  .acts .ib small { position: absolute; right: 2px; top: 4px; font-size: 10px; font-weight: 800; color: rgb(var(--dyn)); }
  #like.on { color: #ff4f6d; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 50% { transform: scale(1.35); } }

  /* lyrics: lines light up with the song, tap one to jump there */
  .art { position: relative; }
  .lyr { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; display: none; padding: 30% 4px 45%;
    -webkit-mask-image: linear-gradient(transparent, #000 18%, #000 75%, transparent); mask-image: linear-gradient(transparent, #000 18%, #000 75%, transparent); }
  .lyr::-webkit-scrollbar { display: none; }
  .lyrics .lyr { display: block; animation: fade .3s ease both; }
  .lyrics .art .cv { opacity: 0; transform: scale(.7); pointer-events: none; }
  .lyr p { margin: 0; padding: 7px 0; font-size: 24px; font-weight: 800; line-height: 1.25; letter-spacing: -.3px;
    color: rgba(255,255,255,.28); transition: color .35s, transform .35s, filter .35s; transform-origin: left center; filter: blur(.4px); }
  .lyr p.on { color: #fff; transform: scale(1.04); filter: none; text-shadow: 0 0 24px rgb(var(--dyn) / .6); }
  .lyr p.past { color: rgba(255,255,255,.5); filter: none; }
  .lyr.plain p { font-size: 18px; font-weight: 600; color: rgba(255,255,255,.85); filter: none; padding: 2px 0; }
  .lyr .note { color: var(--hint); text-align: center; font-size: 15px; padding-top: 30%; }

  /* bottom sheet: what plays next */
  .full .sheet { position: absolute; z-index: 5 !important; left: 0; right: 0; bottom: 0; max-height: 72%; display: flex; flex-direction: column;
    background: rgba(24,24,24,.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px 20px 0 0;
    padding: 8px 16px calc(16px + var(--safe-b)); transform: translateY(105%); transition: transform .35s cubic-bezier(.2,1,.3,1); }
  .sheet.show { transform: none; }
  .sheet .grip { width: 38px; height: 5px; border-radius: 3px; background: #444; margin: 2px auto 10px; }
  .sheet h3 { margin: 0 0 6px; font-size: 18px; font-weight: 800; }
  .sheet .list { overflow-y: auto; }

  .toast { position: fixed; z-index: 30; left: 16px; right: 16px; top: 12px; padding: 12px 16px; border-radius: 12px; background: var(--bg3);
    text-align: center; transform: translateY(-160%); transition: transform .3s; pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .toast.show { transform: none; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="paused">

<section class="page on" id="p-home">
  <div class="top"><div><div class="hello" id="hello"></div></div><div class="avatar" id="avatar"></div></div>
  <div class="hero" id="hero">
    <canvas id="wave"></canvas>
    <div class="content">
      <b id="hero-title"></b>
      <button class="bigplay" id="hero-play" aria-label="play"></button>
      <span id="hero-sub"></span>
    </div>
  </div>
  <div id="recent-box"><h2 id="h-recent"></h2><div class="shelf" id="recent"></div></div>
  <h2 id="h-chart"></h2>
  <div class="chips" id="chart-kinds"></div>
  <div id="chart-list"></div>
  <h2 id="h-moods"></h2>
  <div class="shelf" id="moods"></div>
  <h2 id="h-mine"></h2>
  <div class="shelf" id="mine"></div>
</section>

<section class="page" id="p-search">
  <h1 id="t-search"></h1>
  <form class="search" id="form">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".55"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" enterkeyhint="search">
  </form>
  <div id="results"></div>
</section>

<section class="page" id="p-coll"></section>
<section class="page" id="p-detail"></section>

<div class="mini" id="mini">
  <div id="mini-cv"></div>
  <div class="t"><b id="mini-title">—</b><span id="mini-artist"></span></div>
  <button class="ib" id="mini-pp" aria-label="play"></button>
  <button class="ib" id="mini-next" aria-label="next"></button>
  <div class="prog" id="mini-prog"></div>
</div>

<nav class="tabbar">
  <button class="on" data-p="home" id="tb-home"></button>
  <button data-p="search" id="tb-search"></button>
  <button data-p="coll" id="tb-coll"></button>
</nav>

<section class="full" id="full">
  <div class="backdrop" id="backdrop"></div>
  <div class="bar"><button class="ib" id="close" aria-label="close"></button><span id="from"></span><button class="ib" id="qbtn" aria-label="queue"></button></div>
  <div class="art"><div id="art"></div><div class="lyr" id="lyr"></div></div>
  <div class="info"><div class="t"><b id="f-title">—</b><span id="f-artist"></span></div></div>
  <div class="seek" id="seek"><div class="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
  <div class="ctrl">
    <button class="ib tg" id="shuffle" aria-label="shuffle"></button>
    <button class="ib" id="prev" aria-label="prev"></button>
    <button class="ib pp" id="pp" aria-label="play"></button>
    <button class="ib" id="next" aria-label="next"></button>
    <button class="ib tg" id="repeat" aria-label="repeat"></button>
  </div>
  <div class="acts">
    <button class="ib" id="like" aria-label="like"></button>
    <button class="ib" id="lyrbtn" aria-label="lyrics"></button>
    <button class="ib" id="sleep" aria-label="sleep timer"></button>
    <button class="ib" id="share" aria-label="share"></button>
  </div>
  <div class="sheet" id="sheet"><div class="grip"></div><h3 id="t-next"></h3><div class="list" id="next-list"></div></div>
</section>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto" playsinline></audio>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const init = tg ? tg.initData : "";
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0d0d0d"); tg.setBackgroundColor("#0d0d0d"); tg.setBottomBarColor && tg.setBottomBarColor("#0d0d0d"); } catch (e) {} }
function haptic(kind) {
  try { const h = tg && tg.HapticFeedback; if (!h) return; kind === "ok" ? h.notificationOccurred("success") : h.impactOccurred(kind || "light"); } catch (e) {}
}

const NEXT = '<path d="M5 6.2v11.6a1 1 0 0 0 1.55.83L14.5 13v4.8a1 1 0 0 0 1.55.83l.15-.1V6.47a1 1 0 0 0-1.7-.71L14.5 6v5L6.55 5.37A1 1 0 0 0 5 6.2z"/><rect x="17" y="5" width="2.6" height="14" rx="1.2"/>';
const I = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.3"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.3"/></svg>',
  next: `<svg viewBox="0 0 24 24">${NEXT}</svg>`,
  prev: `<svg viewBox="0 0 24 24" style="transform:scaleX(-1)">${NEXT}</svg>`,
  down: '<svg viewBox="0 0 24 24"><path d="M5.3 8.8a1 1 0 0 1 1.4 0L12 14.1l5.3-5.3a1 1 0 1 1 1.4 1.4l-6 6a1 1 0 0 1-1.4 0l-6-6a1 1 0 0 1 0-1.4z"/></svg>',

/* ---------- per-device memory (may be unavailable: then simply empty) */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let recent = store.get("recent", []);
function remember(it) {
  const slim = {id: it.fid ? "fid:" + it.fid : it.id, title: it.title, duration: it.duration || 0};
  if (it.cover || isYt(it.id)) slim.cover = imgOf(it, false);
  recent = [slim, ...recent.filter(r => r.title.toLowerCase() !== it.title.toLowerCase())].slice(0, 20);
  store.set("recent", recent);
}
const fidOf = it => it ? (it.fid || (it.id.startsWith("fid:") ? it.id.slice(4) : "")) : "";
const isLiked = it => { const f = fidOf(it); return !!f && me.likes.some(l => l.id === "fid:" + f); };

/* ---------- helpers */
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const split = title => { const i = title.indexOf(" - "); return i > 0 ? [title.slice(i + 3), title.slice(0, i)] : [title, ""]; };
const isYt = id => /^[\w-]{11}$/.test(id);
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const hue = t => hash(t) % 360;
const grad = t => `linear-gradient(135deg,hsl(${hue(t)} 70% 45%),hsl(${(hue(t) + 50) % 360} 75% 30%))`;
const letter = t => esc((split(t)[0].match(/[\p{L}\p{N}]/u) || ["♪"])[0].toUpperCase());
function imgOf(it, big) {
  if (it.cover) return big ? it.cover.replace(/\d+x\d+bb/, "600x600bb") : it.cover;
  if (isYt(it.id)) return `https://i.ytimg.com/vi/${it.id}/${big ? "hqdefault" : "mqdefault"}.jpg`;
  return "";
}
function cover(it, big = false, id = "") {
  const src = imgOf(it, big);
  return `<div class="cv" ${id ? `id="${id}"` : ""} style="background:${grad(it.title)}">${letter(it.title)}${src ? `<img loading="lazy" src="${esc(src)}" onerror="this.remove()">` : ""}</div>`;
}
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"X-Init-Data": init, "Content-Type": "application/json"}});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.error || S("err")); e.api = true; throw e; }
  return data;
}
function toast(text) { const el = $("toast"); el.textContent = text; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); }
const current = () => (pos >= 0 ? queue[order[pos]] : null);

function rows(items, ranked = false) {
  const cur = current();
  return items.map((it, i) => {
    const [name, artist] = split(it.title);
    const on = cur && cur.id === it.id;
    const right = on ? '<div class="eq"><i></i><i></i><i></i></div>' : `<span class="dur">${it.duration ? fmt(it.duration) : ""}</span>`;
    return `<div class="row ${on ? "playing" : ""}" data-i="${i}">${ranked ? `<div class="rank">${i + 1}</div>` : ""}${cover(it)}
      <div class="t"><b>${esc(name)}</b><span>${esc(artist || "—")}</span></div>${right}</div>`;
  }).join("");
}
function bind(el, items) { el.querySelectorAll(".row").forEach(r => r.onclick = () => { haptic(); playList(items, +r.dataset.i); }); }

}
function renderPage() {

function playList(items, i, fresh = false) {
  const cur = current();
  if (!fresh && cur && queue === items && cur.id === items[i].id && audio.src) { toggle(); return; }
  queue = items; order = items.map((_, k) => k);
  if (shuffle) { order.splice(i, 1); order.sort(() => Math.random() - .5); order.unshift(i); pos = 0; } else pos = i;
  playCurrent();
}
function startFlow() {
  haptic("medium");
  if (current() && audio.src && queue.flow) { toggle(); return; }
  const mix = [...me.likes, ...(charts.world || []).slice(0, 30), ...(charts[chartKind] || []).slice(0, 20)];
  const seen = new Set(), items = mix.filter(it => !seen.has(it.title.toLowerCase()) && seen.add(it.title.toLowerCase()));
  if (!items.length) { loadChart(); toast(S("chartFail")); return; }
  items.flow = true; shuffle = true; syncToggles();
  playList(items, Math.floor(Math.random() * items.length), true);
}
function toggle() { if (!audio.src) return; haptic(); audio.paused ? audio.play().catch(() => {}) : audio.pause(); }
function step(d) { if (!queue.length) return; pos = (pos + d + order.length) % order.length; playCurrent(); }
async function playCurrent() {
  const it = current(); if (!it) return;
  const [name, artist] = split(it.title);
  wireViz();
  $("mini").classList.add("show");
  $("mini-cv").innerHTML = cover(it);
  $("mini-title").textContent = name; $("mini-artist").textContent = "⏳ " + (artist || "");
  $("f-title").textContent = name; $("f-artist").textContent = artist;
  $("art").innerHTML = cover(it, true);
  const src = imgOf(it, true);
  $("backdrop").style.background = src ? `center/cover url("${src}"), ${grad(it.title)}` : grad(it.title);
  tint(it); resetLyrics(); syncLike(); renderQueue();
  renderPage();
  try {
    if (!it.url) {
      const r = await api("/api/play", {method: "POST", body: JSON.stringify({id: it.id, title: it.title})});
      it.url = r.url; if (r.fid) it.fid = r.fid; if (r.sent) toast(S("sent"));
    }
    syncLike(); remember(it);
    if (full.classList.contains("lyrics")) loadLyrics(it);
    if (current() !== it) return;
    audio.src = it.url;
    await audio.play();
    $("mini-artist").textContent = artist;
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: name, artist, artwork: src ? [{src, sizes: "512x512"}] : []});
  } catch (e) {
    if (current() === it) { $("mini-artist").textContent = artist; toast(e.api ? e.message : S("err")); haptic("heavy"); }
  }
}
function syncPP() {
  const ic = audio.paused ? I.play : I.pause;
  $("pp").innerHTML = ic; $("mini-pp").innerHTML = ic;
  $("hero-play").innerHTML = audio.paused || !queue.flow ? I.play : I.pause;
  document.body.classList.toggle("paused", audio.paused);
}
function syncToggles() { $("shuffle").classList.toggle("on", shuffle); $("repeat").classList.toggle("on", repeat); }
audio.addEventListener("play", () => { syncPP(); renderPage(); });
audio.addEventListener("pause", syncPP);
audio.addEventListener("ended", () => { if (repeat) { audio.currentTime = 0; audio.play(); } else step(1); });
audio.addEventListener("timeupdate", () => {
  const p = audio.duration ? audio.currentTime / audio.duration * 100 : 0;
  $("cur").textContent = fmt(audio.currentTime); $("dur").textContent = fmt(audio.duration);
  $("fill").style.width = p + "%"; $("knob").style.left = p + "%"; $("mini-prog").style.width = p + "%";
});
(() => {
  const bar = $("seek"); let drag = false;
  const move = e => { const r = bar.getBoundingClientRect(); if (audio.duration) audio.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * audio.duration; };
  bar.addEventListener("pointerdown", e => { drag = true; bar.setPointerCapture(e.pointerId); move(e); });
  bar.addEventListener("pointermove", e => drag && move(e));
  bar.addEventListener("pointerup", () => { drag = false; haptic(); });
})();

/* full player: open from the mini player, swipe the cover to switch, swipe down to close */
const full = $("full");
function openFull() { full.classList.add("show"); haptic("medium"); if (tg && tg.BackButton) tg.BackButton.show(); }
function closeFull() { full.classList.remove("show"); $("sheet").classList.remove("show"); if (tg && tg.BackButton) tg.BackButton.hide(); }
$("mini").onclick = e => { if (!e.target.closest("button")) openFull(); };
$("close").onclick = closeFull;
if (tg && tg.BackButton) tg.BackButton.onClick(() => full.classList.contains("show") ? closeFull() : page === "detail" && show(prevPage));
(() => {
  let x0 = 0, y0 = 0, on = false;
  full.addEventListener("touchstart", e => { if (e.target.closest("#seek, .ctrl, .acts, .lyr, .sheet")) return; on = true; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  full.addEventListener("touchmove", e => {
    if (!on) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0, cv = $("art").firstElementChild;
    if (dy > 0 && dy > Math.abs(dx)) { full.style.transition = "none"; full.style.transform = `translateY(${dy}px)`; }
    else if (cv) cv.style.transform = `translateX(${dx}px) rotate(${dx * .03}deg)`;
  }, {passive: true});
  full.addEventListener("touchend", e => {
    if (!on) return; on = false;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0, cv = $("art").firstElementChild;
    full.style.transition = ""; full.style.transform = ""; if (cv) cv.style.transform = "";
    if (dy > 110 && dy > Math.abs(dx)) closeFull();
    else if (Math.abs(dx) > 70) { haptic("medium"); step(dx < 0 ? 1 : -1); }
  });
})();

/* hero wave: flowing lines that breathe with the music (real spectrum when Web Audio runs) */
let actx = null, analyser = null, freq = null;
document.addEventListener("pointerdown", () => {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) { actx = null; }
}, {capture: true});
function wireViz() {
  if (analyser || !actx || actx.state !== "running") return;
  try {
    const src = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser(); analyser.fftSize = 64; analyser.smoothingTimeConstant = .85;
    src.connect(analyser); analyser.connect(actx.destination); freq = new Uint8Array(analyser.frequencyBinCount);
  } catch (e) { analyser = null; }
}
const cv = $("wave"), cx = cv.getContext("2d");
function sizeWave() { const r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; }
addEventListener("resize", sizeWave);
let energy = 0;
let pulse = 0;
function drawWave(t) {
  requestAnimationFrame(drawWave);
  let level = audio.paused ? 0 : .35 + Math.sin(t / 260) * .08;
  if (analyser && !audio.paused) { analyser.getByteFrequencyData(freq); level = freq.slice(0, 12).reduce((a, b) => a + b, 0) / (12 * 255); }
  energy += (level - energy) * .08;
  pulse += (level - pulse) * .3;
  if (full.classList.contains("show")) {
    document.documentElement.style.setProperty("--glow", Math.max(0, pulse * 1.3 - .15).toFixed(3));
    if (full.classList.contains("lyrics")) syncLyrics();
  }
  if (page !== "home" || !cv.width) return;
  const w = cv.width, h = cv.height, d = devicePixelRatio;
  cx.fillStyle = "#000"; cx.fillRect(0, 0, w, h);
  const cols = [`rgb(${dyn.join(",")})`, "#ff8a3d", "#ff3d7f", "#9b5cff", "#3dc8ff"];
  cx.globalCompositeOperation = "lighter";
  for (let k = 0; k < cols.length; k++) {
    const amp = h * (.07 + energy * .16) * (1 - k * .1), speed = t / (1400 + k * 260), yb = h * (.5 + (k - 2) * .045);
    const g = cx.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, "transparent"); g.addColorStop(.5, cols[k]); g.addColorStop(1, "transparent");
    cx.strokeStyle = g; cx.lineWidth = (2.2 + energy * 3) * d; cx.globalAlpha = .75;
    cx.beginPath();
    for (let x = 0; x <= w; x += 6 * d) {
      const p = x / w;
      const y = yb + Math.sin(p * 6.3 + speed + k) * amp * Math.sin(p * Math.PI) + Math.sin(p * 13 - speed * 1.7) * amp * .25;
      x ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    cx.stroke();
  }
  cx.globalCompositeOperation = "source-over"; cx.globalAlpha = 1;
  const rg = cx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * .6);
  rg.addColorStop(0, "transparent"); rg.addColorStop(1, "rgba(0,0,0,.55)");
  cx.fillStyle = rg; cx.fillRect(0, 0, w, h);
}
requestAnimationFrame(drawWave);

/* colours: the whole player takes the main colour of the cover */
let dyn = [255, 216, 61];
const tintCache = {};
function vivid([r, g, b]) {
  // to HSL, then make it bright enough to shine on black but never neon-white
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l0 = (mx + mn) / 2, dd = mx - mn;
  let h = 0, s0 = 0;
  if (dd) { s0 = dd / (1 - Math.abs(2 * l0 - 1)); h = mx === r ? ((g - b) / dd) % 6 : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4; h *= 60; }
  const s = Math.max(.55, Math.min(.9, s0)), l = Math.max(.52, Math.min(.66, l0));
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const [a, bb, cc] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return [a, bb, cc].map(v => Math.round((v + m) * 255));
}
function fromHash(t) { const hh = hue(t); return vivid(hslToRgb(hh, .7, .55)); }
function hslToRgb(h, s, l) { const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))))); }
function sample(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement("canvas"); c.width = c.height = 24;
        const g = c.getContext("2d"); g.drawImage(img, 0, 0, 24, 24);
        const d = g.getImageData(0, 0, 24, 24).data;
        let R = 0, G = 0, B = 0, W = 0;
        for (let i = 0; i < d.length; i += 4) {
          const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
          const w = ((mx - mn) / 255) ** 2 * (mx > 40 && mx < 250 ? 1 : .05);
          R += d[i] * w; G += d[i + 1] * w; B += d[i + 2] * w; W += w;
        }
        res(W > .5 ? vivid([R / W, G / W, B / W]) : null);
      } catch (e) { res(null); }
    };
    img.onerror = () => res(null);
    img.src = "/api/cover?u=" + encodeURIComponent(src);
  });
}
async function tint(it) {
  const src = imgOf(it, false), key = src || it.title;
  setDyn(tintCache[key] || fromHash(it.title));
  if (!src || tintCache[key]) return;
  const c = await sample(src);
  if (c) { tintCache[key] = c; if (current() === it) setDyn(c); }
}
function setDyn(c) {
  dyn = c;
  document.documentElement.style.setProperty("--dyn", c.join(" "));
}

/* lyrics */
let lyrIdx = -1;
function resetLyrics() { lyrIdx = -1; $("lyr").innerHTML = ""; $("lyr").className = "lyr"; }
async function loadLyrics(it) {
  const box = $("lyr");
  if (it.lyr === undefined) {
    box.innerHTML = `<div class="note">${esc(S("lyrLoad"))}</div>`;
    try { it.lyr = await api("/api/lyrics?title=" + encodeURIComponent(it.title)); } catch (e) { it.lyr = {}; }
    if (current() !== it) return;
  }
  const {synced, text} = it.lyr || {};
  lyrIdx = -1;
  if (synced && synced.length) {
    box.className = "lyr";
    box.innerHTML = synced.map(([t, line], i) => `<p data-t="${t}" data-i="${i}">${esc(line || "♪")}</p>`).join("");
    box.querySelectorAll("p").forEach(p => p.onclick = () => { haptic(); audio.currentTime = +p.dataset.t; if (audio.paused) audio.play().catch(() => {}); });
  } else if (text) {
    box.className = "lyr plain";
    box.innerHTML = text.split("\n").map(l => `<p>${esc(l) || "&nbsp;"}</p>`).join("");
  } else box.innerHTML = `<div class="note">🎤<br>${esc(S("noLyrics"))}</div>`;
}
function syncLyrics() {
  const it = current(), lines = it && it.lyr && it.lyr.synced;
  if (!lines || !lines.length) return;
  const now = audio.currentTime + .3;
  let i = -1;
  for (let k = 0; k < lines.length && lines[k][0] <= now; k++) i = k;
  if (i === lyrIdx) return;
  lyrIdx = i;
  const ps = $("lyr").querySelectorAll("p");
  ps.forEach((p, k) => { p.classList.toggle("on", k === i); p.classList.toggle("past", k < i); });
  const el = ps[Math.max(0, i)], box = $("lyr");
  if (el) box.scrollTo({top: el.offsetTop - box.clientHeight * .38, behavior: "smooth"});
}
$("lyrbtn").onclick = () => {
  haptic();
  const on = full.classList.toggle("lyrics");
  $("lyrbtn").classList.toggle("on", on);
  const it = current();
  if (on && it && !$("lyr").children.length) loadLyrics(it);
};

/* like from the player */
function syncLike() {
  const it = current(), b = $("like"), liked = isLiked(it);
  b.disabled = !fidOf(it);
  b.classList.toggle("on", liked);
  b.innerHTML = liked ? I.heart : I.heartO;
}
$("like").onclick = async () => {
  const it = current(); if (!it) return;
  const f = fidOf(it); if (!f) { toast(S("likeNeed")); return; }
  try {
    const r = await api("/api/like", {method: "POST", body: JSON.stringify({id: "fid:" + f, title: it.title, duration: it.duration || Math.round(audio.duration) || 0})});
    me.likes = r.liked ? [{id: "fid:" + f, title: it.title, duration: it.duration || 0}, ...me.likes] : me.likes.filter(l => l.id !== "fid:" + f);
    haptic(r.liked ? "ok" : "light"); toast(S(r.liked ? "likedT" : "unlikedT")); syncLike();
  } catch (e) { toast(e.message); }
};

/* sleep timer: off -> 15 -> 30 -> 60 min -> off */
let sleepMin = 0, sleepT = null;
function syncSleep() { $("sleep").classList.toggle("on", !!sleepMin); $("sleep").innerHTML = I.moon + (sleepMin ? `<small>${sleepMin}</small>` : ""); }
$("sleep").onclick = () => {
  haptic();
  sleepMin = {0: 15, 15: 30, 30: 60, 60: 0}[sleepMin];
  clearTimeout(sleepT);
  if (sleepMin) { sleepT = setTimeout(() => { fadeOut(); sleepMin = 0; syncSleep(); }, sleepMin * 60000); toast(S("sleepOn").replace("{m}", sleepMin)); }
  else toast(S("sleepOff"));
  syncSleep();
};
function fadeOut() {
  const v0 = audio.volume; let k = 0;
  const id = setInterval(() => { k++; audio.volume = Math.max(0, v0 * (1 - k / 30)); if (k >= 30) { clearInterval(id); audio.pause(); audio.volume = v0; } }, 100);
}

/* share: the bot's inline mode puts the song into any chat */
$("share").onclick = () => {
  const it = current(); if (!it) return; haptic();
  try { tg.switchInlineQuery(split(it.title).reverse().filter(Boolean).join(" - "), ["users", "groups", "channels"]); }
  catch (e) { toast(S("err")); }
};

/* queue sheet */
function renderQueue() {
  const box = $("next-list"); if (!box) return;
  const up = order.slice(pos + 1, pos + 41).map(k => queue[k]);
  if (!up.length) { box.innerHTML = `<div class="empty">${esc(S("queueEnd"))}</div>`; return; }
  box.innerHTML = rows(up);
  box.querySelectorAll(".row").forEach(r => r.onclick = () => { haptic(); pos += 1 + +r.dataset.i; playCurrent(); });
}
$("qbtn").onclick = () => { haptic(); renderQueue(); $("sheet").classList.toggle("show"); };
$("sheet").querySelector(".grip").onclick = () => $("sheet").classList.remove("show");

/* controls */
$("pp").onclick = toggle; $("mini-pp").onclick = toggle; $("hero-play").onclick = startFlow;
$("next").onclick = () => { haptic(); step(1); }; $("mini-next").onclick = () => { haptic(); step(1); };
$("prev").onclick = () => { haptic(); audio.currentTime > 4 ? (audio.currentTime = 0) : step(-1); };
$("shuffle").onclick = () => { shuffle = !shuffle; haptic(); syncToggles(); };
$("repeat").onclick = () => { repeat = !repeat; haptic(); syncToggles(); };
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
  navigator.mediaSession.setActionHandler("nexttrack", () => step(1));
}
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => { haptic(); show(b.dataset.p); });
let seq = 0;
$("form").onsubmit = async e => {
  e.preventDefault();
  const q = $("q").value.trim(); if (q.length < 2) return;
  $("q").blur(); const my = ++seq; loading = true; renderSearch();
  try { const r = await api("/api/search?q=" + encodeURIComponent(q)); if (my === seq) results = r.items; }
  catch (err) { if (my === seq) { results = []; toast(err.message); } }
  if (my === seq) { loading = false; renderSearch(); if (results.length) haptic("ok"); }
};
$("q").addEventListener("input", () => { if (!$("q").value.trim()) { results = []; renderSearch(); } });

/* start */
$("pp").innerHTML = $("mini-pp").innerHTML = $("hero-play").innerHTML = I.play;
$("next").innerHTML = $("mini-next").innerHTML = I.next; $("prev").innerHTML = I.prev;
$("close").innerHTML = I.down; $("shuffle").innerHTML = I.shuffle; $("repeat").innerHTML = I.repeat;
$("qbtn").innerHTML = I.queue; $("lyrbtn").innerHTML = I.lyr; $("share").innerHTML = I.share; syncSleep(); syncLike();
(async () => {
  applyLang(); sizeWave(); renderPage(); loadChart();
  show.t = setTimeout(() => document.body.classList.add("norise"), 1500);
  try {
    me = await api("/api/me");
    if (me.lang && L[me.lang]) { lang = me.lang; applyLang(); }
    const start = tg && tg.initDataUnsafe.start_param;
    if (start && start.startsWith("pl_")) { const pl = await api("/api/playlist/" + encodeURIComponent(start.slice(3))); openPlaylist(pl); return; }
  } catch (e) { toast(e.message); }
  renderPage();
})();
</script>
